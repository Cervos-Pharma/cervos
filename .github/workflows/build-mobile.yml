name: Build Android APK (Expo EAS)

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - ".github/workflows/build-mobile.yml"
  workflow_dispatch: {}

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    outputs:
      apk_url: ${{ steps.eas_build.outputs.apk_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install mobile dependencies
        run: npm install --legacy-peer-deps

      - name: Type-check mobile app
        run: npx tsc --noEmit

      - name: Build Android APK via EAS (production profile)
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://cervos.online' }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          echo "Starting EAS cloud build for Android APK..."
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait \
            --json > eas_output.json 2> eas_stderr.log || {
              echo "EAS Build failed with stderr:"
              cat eas_stderr.log
              exit 1
            }

          cat eas_stderr.log || true
          echo "Build finished successfully. Parsing artifact URL..."

          APK_URL=$(node -e "
            const fs = require('fs');
            try {
              const raw = fs.readFileSync('eas_output.json', 'utf8');
              const data = JSON.parse(raw);
              const item = Array.isArray(data) ? data[0] : data;
              const url = item?.artifacts?.buildUrl || item?.artifacts?.applicationArchiveUrl || item?.artifactUrl || '';
              if (!url) throw new Error('No artifact URL found in EAS output');
              process.stdout.write(url);
            } catch (err) {
              console.error('Error parsing EAS JSON:', err.message);
              process.exit(1);
            }
          ")

          echo "APK Download URL: $APK_URL"
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"

      - name: Download APK from EAS
        run: |
          curl -fSL "${{ steps.eas_build.outputs.apk_url }}" -o Cervos-Pharma.apk
          ls -lh Cervos-Pharma.apk
          test -s Cervos-Pharma.apk || { echo "Downloaded APK is empty"; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cervos-android-apk
          path: apps/mobile/Cervos-Pharma.apk
          if-no-files-found: error

  release-apk:
    needs: build-android-apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: cervos-android-apk

      - name: Publish / update rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view installers -R Cervos-Pharma/cervos > /dev/null 2>&1 || \
            gh release create installers -R Cervos-Pharma/cervos --target main \
              --title "Cervos Installers" \
              --notes "Latest installers, rebuilt automatically from main." || true
          gh release upload installers Cervos-Pharma.apk -R Cervos-Pharma/cervos --clobber
