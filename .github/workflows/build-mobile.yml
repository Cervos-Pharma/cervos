name: Build Android APK (Expo EAS)

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
    tags:
      - "android-v*"
  workflow_dispatch: {}

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Straight eas-cli install instead of expo/expo-github-action: that
      # wrapper was the only failing step (token itself verified working),
      # and all we actually need is the CLI plus EXPO_TOKEN in the env.
      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install mobile dependencies
        run: npm install --legacy-peer-deps

      - name: Type-check mobile app
        run: npx tsc --noEmit

      - name: Build installable Android APK (EAS preview profile)
        # --wait + --output: blocks until EAS finishes and writes the .apk
        # straight to a stable filename for the release job.
        run: >
          eas build --platform android --profile preview
          --non-interactive --wait --output Cervos-Pharma.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://cervos.online' }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Verify APK
        run: |
          test -s Cervos-Pharma.apk || { echo "No APK produced"; exit 1; }
          ls -la Cervos-Pharma.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cervos-android-apk
          path: apps/mobile/Cervos-Pharma.apk
          if-no-files-found: error

  # Same rolling "installers" release the desktop workflow publishes to, so
  # the site's download buttons hit one stable URL per file.
  release-apk:
    needs: build-android-apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: cervos-android-apk

      - name: Publish / update rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # -R because this job has no git checkout: gh must not depend on
        # local repo context to create/update the rolling release.
        run: |
          gh release view installers -R Cervos-Pharma/cervos >/dev/null 2>&1 || \
            gh release create installers -R Cervos-Pharma/cervos --target main \
              --title "Cervos Installers" \
              --notes "Latest installers, rebuilt automatically from main." || true
          gh release upload installers Cervos-Pharma.apk -R Cervos-Pharma/cervos --clobber
