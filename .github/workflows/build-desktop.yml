name: Build Desktop Installers (Windows)

# Produces the downloadable .exe installers for the Pharmacy POS and the
# Supplier desktop app. Runs on a real Windows runner because Tauri's NSIS
# bundler needs the Windows linker/SDK — it cannot be cross-compiled from Linux.
#
# Triggers:
#   - Push a tag like "pos-v0.1.5" or "supplier-v0.1.1" to build+release just that app
#   - Manual run from the Actions tab (workflow_dispatch) to build both
#   - Every push to main also builds both, as unsigned CI artifacts, so you can
#     sanity-check a build without cutting a release

on:
  push:
    branches: [main]
    tags:
      - "pos-v*"
      - "supplier-v*"
  workflow_dispatch: {}

jobs:
  build-pos:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/supplier-v')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cervos-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Write runtime env (Supabase project + web app URL)
        # These three values are safe to ship in the built app — they are the
        # public Supabase URL/anon key and the public web app URL, the same
        # values a browser sees when hitting cervos.online. Set the *real*
        # values in: Repo Settings → Secrets and variables → Actions.
        # Never put PAYME_APP_SECRET or SUPABASE_SERVICE_ROLE_KEY here —
        # those stay server-side only, in the web app's own env.
        shell: bash
        run: |
          cat > .env <<EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          VITE_WEB_URL=${{ vars.VITE_WEB_URL || 'https://cervos.online' }}
          VITE_APP_URL=${{ vars.VITE_APP_URL || 'https://cervos.online' }}
          EOF

      - name: Build Tauri app (.exe + NSIS installer)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: cervos-desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: cervos-pos-windows-installer
          path: |
            cervos-desktop/src-tauri/target/release/bundle/nsis/*.exe
            cervos-desktop/src-tauri/target/release/*.exe
          if-no-files-found: error

  build-supplier:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/pos-v')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cervos-supplier-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Write runtime env
        shell: bash
        run: |
          cat > .env <<EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          VITE_WEB_URL=${{ vars.VITE_WEB_URL || 'https://cervos.online' }}
          VITE_APP_URL=${{ vars.VITE_APP_URL || 'https://cervos.online' }}
          EOF

      - name: Build Tauri app (.exe + NSIS installer)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: cervos-supplier-desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: cervos-supplier-windows-installer
          path: |
            cervos-supplier-desktop/src-tauri/target/release/bundle/nsis/*.exe
            cervos-supplier-desktop/src-tauri/target/release/*.exe
          if-no-files-found: error

  # Publishes the installers to a single rolling GitHub Release ("installers")
  # under stable asset names, so the website can link DIRECTLY to the file:
  #   https://github.com/Cervos-Pharma/cervos/releases/latest/download/Cervos-POS-Setup.exe
  # Clicking that URL downloads immediately — no release page in between.
  release:
    needs: [build-pos, build-supplier]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cervos-*-windows-installer

      - name: Stage assets with stable names
        run: |
          mkdir -p dist
          find cervos-pos-windows-installer -name '*.exe' -path '*nsis*' -exec cp -f {} dist/Cervos-POS-Setup.exe \;
          find cervos-supplier-windows-installer -name '*.exe' -path '*nsis*' -exec cp -f {} dist/Cervos-Supplier-Portal-Setup.exe \;
          # Fallback: if the NSIS layout ever changes, grab any built exe
          [ -f dist/Cervos-POS-Setup.exe ] || find cervos-pos-windows-installer -name '*.exe' | head -1 | xargs -r -I{} cp -f {} dist/Cervos-POS-Setup.exe
          [ -f dist/Cervos-Supplier-Portal-Setup.exe ] || find cervos-supplier-windows-installer -name '*.exe' | head -1 | xargs -r -I{} cp -f {} dist/Cervos-Supplier-Portal-Setup.exe
          ls -la dist

      - name: Publish / update rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # -R because this job has no git checkout: gh must not depend on
        # local repo context to create/update the rolling release.
        run: |
          gh release view installers -R Cervos-Pharma/cervos >/dev/null 2>&1 || \
            gh release create installers -R Cervos-Pharma/cervos --target main \
              --title "Cervos Installers" \
              --notes "Latest Windows installers, rebuilt automatically from main." || true
          gh release upload installers dist/* -R Cervos-Pharma/cervos --clobber
